name: idealday

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idealday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idealday}
      POSTGRES_DB: ${POSTGRES_DB:-idealday}
    ports:
      - "5433:5432" # 5433 снаружи, чтобы не конфликтовать с локальным Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-idealday}:${POSTGRES_PASSWORD:-idealday}@db:5432/${POSTGRES_DB:-idealday}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-idealday}:${POSTGRES_PASSWORD:-idealday}@db:5432/${POSTGRES_DB:-idealday}_test
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
