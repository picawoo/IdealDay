name: idealday

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idealday}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан, выполните python3 scripts/init_env.py}"
      POSTGRES_DB: ${POSTGRES_DB:-idealday}
    ports:
      - "127.0.0.1:5433:5432" # только localhost, 5433 чтобы не конфликтовать с локальным Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: idealday-api
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment: &app_environment
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-idealday}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан, выполните python3 scripts/init_env.py}@db:5432/${POSTGRES_DB:-idealday}"
      TEST_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-idealday}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан, выполните python3 scripts/init_env.py}@db:5432/${POSTGRES_DB:-idealday}_test"
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET не задан, выполните python3 scripts/init_env.py}"
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  email-notifications:
    image: idealday-api
    profiles: ["notifications"]
    command: python -m app.workers.email_notifications
    environment: *app_environment
    volumes:
      - .:/app:ro
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
